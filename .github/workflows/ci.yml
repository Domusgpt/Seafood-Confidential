name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kit and tracking integrity
        run: pnpm validate
      - name: Tool tests
        run: pnpm test
      - name: Implementation status is current
        run: pnpm devtrack status --check
      - name: Build and check the project hub
        run: |
          pnpm hub:build
          pnpm hub:check
      - name: Formatting
        run: pnpm format:check
      - name: Install pinned lint and scan tools
        run: bash tools/bootstrap/install-dev-tools.sh --binaries
      - name: Lint workflows (actionlint) and shell (shellcheck)
        run: |
          actionlint
          shellcheck tools/bootstrap/*.sh
      - name: Secret scan (gitleaks, full history)
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .
      - name: Validate GLSL shaders (Khronos glslang)
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y --no-install-recommends glslang-tools > /dev/null
          glslangValidator tools/hub/assets/shaders/bathymetry.vert tools/hub/assets/shaders/bathymetry.frag

  visual:
    name: Visual and accessibility check
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm hub:build
      - name: Screenshots and axe scan (desktop, mobile, dark, reduced motion)
        run: pnpm hub:shots --out test-results/hub-shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hub-screenshots-${{ github.sha }}
          path: test-results/hub-shots
          retention-days: 14
